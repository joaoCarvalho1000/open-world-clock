name: Unit tests and audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# What runs here (dependencies are installed from the committed lockfiles):
#   - the Node unit tests in test/unit/
#   - npm audit on the app's and the website's lockfiles
#   - the website link-check tests (cloudflare/check-links.test.mjs, fetch is stubbed, no network)
#   - the website analytics gate tests (cloudflare/analytics-gate.test.mjs): analytics loads only on the production
#     host and never under Do Not Track or Global Privacy Control
#   - the CSP check: site/_headers must list the hash of every inline script in site/*.html
#   - the shared data check: shared/ and apple/Shared/Localizable.xcstrings must match what the exporters produce
#     from src/ today
# The in-app Electron suite (test/run.js driving test/deep.js in a real window) runs in `app`.
# Its failures block the CI gate. Read the deep-report artifact to diagnose runner or application failures.
# Run `npm test` on a Windows PC before a release as well. The live
# link check (`npm run links` in cloudflare/) needs the network and a published release, so it runs before each
# deploy instead.
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # The repo is LF and csp-hashes.mjs hashes the inline scripts byte for byte. The Windows runner's git turns
      # autocrlf on, and a CRLF checkout would report CSP drift that is not there.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the Node that produced shared/golden.json: its time zone data (tz 2026b) is part of the golden values,
      # and a newer Node patch can ship newer tz rules (24.21.0 moved Morocco's end-of-2026 offset). Bump this together
      # with a re-export of shared/.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      # after-pack.test.js packs real app.asar files with @electron/asar (a dev dependency), so install first. No
      # install scripts run: the unit tests need no Electron binary.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: node --test "test/unit/*.test.js"

      - name: Website tests (link check, analytics gate)
        run: node --test cloudflare/check-links.test.mjs cloudflare/analytics-gate.test.mjs

      # Exits 1 when site/_headers is out of date: the live site would then block its own inline scripts.
      # Fix locally with `npm run csp:write` in cloudflare/.
      - name: CSP hashes match the inline scripts
        run: node cloudflare/csp-hashes.mjs

      # Regenerates shared/ and the iPhone string catalog and fails if they differ from what is committed. Fix locally
      # by running the two exporters and committing the result. -I skips the runtime version lines in the golden.json
      # meta block (node, icu, tz, unicode, cldr), which change with the runner's Node patch release; any other
      # difference still fails.
      - name: Shared data is up to date
        shell: bash
        run: |
          node scripts/export-shared.mjs
          node scripts/export-xcstrings.mjs
          git diff --exit-code -I '^ *"(node|icu|tz|unicode|cldr)": "[^"]*",?$' -- shared apple/Shared/Localizable.xcstrings

      # npm audit reads the lockfiles; no install needed.
      - name: Audit app dependencies
        run: npm audit --audit-level=high

      - name: Audit website dependencies
        working-directory: cloudflare
        run: npm audit --audit-level=high

  app:
    name: In-app suite
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # The suite exercises windows up to 1920 CSS pixels. The hosted runner's
      # default 1024x768 desktop clamps them and invalidates geometry assertions.
      - name: Set the test desktop size
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # electron 44 has no postinstall script (its package.json only offers an `install-electron` bin, and the lockfile
      # has no hasInstallScript for it), so `npm ci` never downloads the Electron binary, whatever allowScripts says.
      # install.js fetches it into node_modules/electron/dist and writes path.txt; it exits at once if both are there.
      - name: Install the Electron binary
        shell: bash
        run: |
          node node_modules/electron/install.js
          if [ ! -f node_modules/electron/path.txt ] || [ ! -d node_modules/electron/dist ]; then
            echo "::error::Electron binary missing after install.js: node_modules/electron/path.txt or dist/ not found."
            exit 1
          fi
          exe="node_modules/electron/dist/$(cat node_modules/electron/path.txt)"
          if [ ! -f "$exe" ]; then
            echo "::error::Electron binary missing: $exe not found."
            exit 1
          fi
          echo "Electron binary: $exe"

      # Starts the app with test/deep.js attached, against a throwaway settings folder, and prints the report.
      - name: Web app (settings match the Windows app; site/app is built from the current sources)
        run: |
          node --test test/web/shim.test.mjs
          node scripts/build-web.mjs --check

      - name: In-app suite
        run: node test/run.js

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-report
          path: test/deep.txt
          if-no-files-found: warn
          retention-days: 14

  website:
    outputs:
      artifact: ${{ steps.release.outputs.artifact-id }}
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: cloudflare
      - run: npm audit --audit-level=high
        working-directory: cloudflare
      - name: Website unit tests and browser settings
        run: node --test 'cloudflare/*.test.mjs' test/web/shim.test.mjs
      - name: Generated site, search metadata, translations and security policy
        run: |
          node scripts/build-web.mjs --check
          node cloudflare/seo-check.mjs
          node cloudflare/site-chrome.mjs
          node cloudflare/asset-versions.mjs
          node cloudflare/csp-hashes.mjs
      - name: Generated pages reproduce their committed source
        run: |
          npm run prepare:site --prefix cloudflare
          git diff --exit-code -- site
          test -z "$(git ls-files --others --exclude-standard -- site)"
      - name: Bundle the Pages Functions without deploying
        working-directory: cloudflare
        run: npm exec --no -- wrangler pages functions build functions --outdir ../dist/pages-functions
      - name: Browser tests for time conversion, sharing and mobile layouts
        env:
          PUPPETEER_CORE: ${{ github.workspace }}/cloudflare
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          "$CHROME_PATH" --version
          node test/web/seo.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: website-browser-report
          path: dist/seo-shots/
          if-no-files-found: warn
          retention-days: 14

      - name: Release safety tests
        run: python -m unittest discover -s .github/scripts -p 'test_site_release.py'
      - name: Package the tested website with commit and file hashes
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python .github/scripts/site_release.py package --site open-world-clock --sha "$RELEASE_SHA" --directory output/website-release
          python .github/scripts/site_release.py prepare --site open-world-clock --sha "$RELEASE_SHA" --directory output/website-release
      - name: Preserve the release from this main workflow run
        id: release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-release-${{ github.sha }}
          path: output/website-release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  gate:
    name: CI gate
    if: always()
    needs: [unit, app, website]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          UNIT: ${{ needs.unit.result }}
          APP: ${{ needs.app.result }}
          WEBSITE: ${{ needs.website.result }}
        run: |
          test "$UNIT" = success
          test "$APP" = success
          test "$WEBSITE" = success

  deploy:
    name: Deploy website
    needs: [gate, website]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.WEBSITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: website-production
      url: https://openworldclock.com
    concurrency:
      group: website-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: cloudflare
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.website.outputs.artifact }}
          path: output/website-release
          merge-multiple: true
      - name: Verify the release before exposing credentials
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python .github/scripts/site_release.py verify --site open-world-clock --sha "$RELEASE_SHA" --directory output/website-release
      - name: Publish, verify production, and roll back a failed release
        env:
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: '52b57879a0260045efcd7a51b2bbdfdb'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python .github/scripts/site_release.py deploy --site open-world-clock --sha "$RELEASE_SHA" --directory output/website-release
      - name: Preserve deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/website-release/deployment.json
          if-no-files-found: warn
          retention-days: 30
