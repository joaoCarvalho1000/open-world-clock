name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Verify Gradle wrapper
        working-directory: android
        run: |
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Install Android SDK components
        run: |
          # sdkmanager ships with the runner image but is not on PATH there.
          root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager="$root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$root/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under $root"
            exit 1
          fi
          yes 2>/dev/null | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Tests, lint, debug APK and optimized release
        working-directory: android
        run: |
          node scripts/check-translations.mjs
          bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
